[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodmap"
version = "0.7.0"
description = "Lossless Blood MAP parsing, validation, and LevelIR composition"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bloodmap = "bloodmap.cli:main"

[tool.setuptools.packages.find]
include = ["bloodmap*"]

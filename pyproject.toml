[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodmap"
version = "1.0.0"
description = "Lossless Blood, Duke3D, and classic Doom map parsing, shared semantics, and conversion"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bloodmap = "bloodmap.cli:main"
llmapper = "bloodmap.cli:main"

[tool.setuptools.packages.find]
include = ["bloodmap*"]
